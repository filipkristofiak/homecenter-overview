---
- name: Set colored PS1 prompt (blue background, bright white text)
  lineinfile:
    path: /root/.bashrc
    regexp: '^export PS1='
    line: "export PS1='\\[\\e[48;2;3;36;200m\\e[97m\\]\\u@\\h\\[\\e[0m\\]:\\w\\$ '"
    state: present
    create: true

- name: Disable SSH reverse DNS lookup (eliminates ~20s login delay)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?UseDNS'
    line: 'UseDNS no'
    state: present
  notify: Restart sshd

- name: Install base prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Add Docker GPG key (dearmored)
  shell: >
    curl -fsSL https://download.docker.com/linux/debian/gpg
    | gpg --dearmor --yes -o /usr/share/keyrings/docker-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/docker-archive-keyring.gpg

- name: Add Docker apt repository
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian bookworm stable\n"
    mode: "0644"
  notify: Update apt cache

- name: Flush handlers (refresh apt cache after Docker repo added)
  meta: flush_handlers

- name: Install Docker Engine and Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Check for Proxmox first-boot snakeoil unit
  stat:
    path: /etc/systemd/system/proxmox-regenerate-snakeoil.service
  register: common_snakeoil_unit
  tags: journal-noise

- name: Create snakeoil drop-in directory
  file:
    path: /etc/systemd/system/proxmox-regenerate-snakeoil.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: common_snakeoil_unit.stat.exists
  tags: journal-noise

- name: Silence the snakeoil first-boot condition check in the journal
  copy:
    dest: /etc/systemd/system/proxmox-regenerate-snakeoil.service.d/quiet.conf
    content: |
      # Managed by Ansible (common role). One-time first-boot unit from the
      # Proxmox LXC template; its skipped-condition line is logged at every unit start.
      [Service]
      LogLevelMax=notice
    owner: root
    group: root
    mode: "0644"
  when: common_snakeoil_unit.stat.exists
  notify: Reload systemd for first-boot drop-ins
  tags: journal-noise

# In these LXCs every service start pulls first-boot-complete.target in via
# sysinit.target. The target stays inactive after boot (ConditionFirstBoot=yes),
# so each start re-checks it and logs "skipped". With a timer starting a service
# every minute (nut-metrics), that one line kept journald writing its files.
# Targets don't accept LogLevelMax. Resetting the condition lets this passive
# sync-point target become active once, after which unit starts log nothing.
- name: Create first-boot-complete target drop-in directory
  file:
    path: /etc/systemd/system/first-boot-complete.target.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: common_snakeoil_unit.stat.exists
  tags: journal-noise

- name: Let first-boot-complete target stay active instead of re-logging its skip
  copy:
    dest: /etc/systemd/system/first-boot-complete.target.d/quiet.conf
    content: |
      # Managed by Ansible (common role). Reset ConditionFirstBoot so the target
      # stays active and is not re-checked (and logged) at every unit start.
      [Unit]
      ConditionFirstBoot=
    owner: root
    group: root
    mode: "0644"
  when: common_snakeoil_unit.stat.exists
  notify: Reload systemd for first-boot drop-ins
  tags: journal-noise
